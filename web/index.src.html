<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
  <meta name="referrer" content="no-referrer" />
  <title>Flock Surveillance Map</title>
  <link rel="preconnect" href="https://server.arcgisonline.com" />
{{PRELOAD}}  <style>{{LEAFLET_CSS}}</style>
  <style>
    html, body { height: 100%; margin: 0; background: #07070b; }
    #map { height: 100%; background: #07070b; }
    #status {
      position: fixed; top: 10px; right: 10px; z-index: 1000;
      background: #111; color: #eee; padding: 8px 12px;
      font: 13px/1.4 monospace; border-radius: 6px;
      border: 1px solid #2a2a33; display: flex; gap: 12px; align-items: center;
    }
    #status label { cursor: pointer; user-select: none; color: #bbb; }
    .fm-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .leaflet-container.fm-hit { cursor: pointer; }
    .fm-pop div + div { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; }
    .fm-more { margin-top: 6px; color: #666; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"><span id="msg">loading map…</span><label><input type="checkbox" id="grid" checked /> cells</label></div>
  <script>{{LEAFLET_JS}}</script>
{{INLINE_DATA}}  <script>
(function () {
  'use strict';
  var VERSION = '{{VERSION}}', CAMS_SRC = 'cams.js?v={{CAMS_HASH}}', MODE = '{{MODE}}';
  var CLUSTER_OFF_ZOOM = 12, CELLS_MAX_ZOOM = 11, GRID = 64, PAD = 0.25, MAX_CANVAS_PX = 16e6, POPUP_MAX = 8;
  var t0 = performance.now();
  var msg = document.getElementById('msg'), gridBox = document.getElementById('grid');

  var map = L.map('map', { minZoom: 2, maxZoom: 18 }).setView([39.8, -98.5], 4);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
    maxNativeZoom: 16, maxZoom: 18,
  }).addTo(map);
  msg.textContent = 'loading cameras…';

  /*DECODE-START*/
  function b64ToBytes(s) {
    var bin = atob(s), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function inflateRaw(u) {
    var st = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(st).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function decodePack(buf) {
    var hlen = new DataView(buf.buffer, buf.byteOffset, buf.byteLength).getUint32(0, true);
    var head = JSON.parse(new TextDecoder().decode(buf.subarray(4, 4 + hlen)));
    if (head.v !== 1) throw new Error('unsupported pack version ' + head.v);
    var n = head.n, p = 4 + hlen;
    function col(delta, Out) {
      var out = new Out(n), prev = 0;
      for (var i = 0; i < n; i++) {
        var v = 0, mul = 1, b;
        do { if (p >= buf.length) throw new Error('pack truncated'); b = buf[p++]; v += (b & 127) * mul; mul *= 128; } while (b & 128);
        if (delta) { prev += (v % 2) ? -(v + 1) / 2 : v / 2; out[i] = prev; } else out[i] = v;
      }
      return out;
    }
    var D = { head: head, n: n, lat: col(true, Int32Array), lon: col(true, Int32Array),
      name: col(false, Uint16Array), op: col(false, Uint16Array), type: col(false, Uint16Array) };
    if (p !== buf.length) throw new Error('pack has trailing bytes');
    return D;
  }
  /*DECODE-END*/

  var B32 = '0123456789bcdefghjkmnpqrstuvwxyz';
  function ghBounds(gh) {
    var la = [-90, 90], lo = [-180, 180], even = true;
    for (var c = 0; c < gh.length; c++) {
      var cd = B32.indexOf(gh[c]);
      for (var m = 16; m >= 1; m >>= 1) {
        var r = even ? lo : la, mid = (r[0] + r[1]) / 2;
        if (cd & m) r[0] = mid; else r[1] = mid;
        even = !even;
      }
    }
    return [la[0], lo[0], la[1], lo[1]]; // s, w, n, e
  }
  var mercX = function (lon) { return (lon + 180) / 360; };
  var mercY = function (lat) {
    lat = Math.max(-85.0511287798, Math.min(85.0511287798, lat));
    var s = Math.sin(lat * Math.PI / 180);
    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  };

  function fail(e) { msg.textContent = 'error: ' + (e && e.message || e); }

  function start(D) {
    var N = D.n, H = D.head, MX = new Float64Array(N), MY = new Float64Array(N);
    for (var i = 0; i < N; i++) { MX[i] = mercX(D.lon[i] / 1e7); MY[i] = mercY(D.lat[i] / 1e7); }
    var NC = H.cells.length, CB = new Float64Array(NC * 4), cellIdx = new Map();
    for (var c = 0; c < NC; c++) {
      var b = ghBounds(H.cells[c][0]);
      CB[c * 4] = mercX(b[1]); CB[c * 4 + 1] = mercY(b[2]); CB[c * 4 + 2] = mercX(b[3]); CB[c * 4 + 3] = mercY(b[0]);
      cellIdx.set(H.cells[c][0], c);
    }

    var pane = map.createPane('fm'); pane.style.zIndex = 450; pane.style.pointerEvents = 'none';
    var cv = L.DomUtil.create('canvas', 'fm-canvas', pane), ctx = cv.getContext('2d');
    var view = null, hits = [], ptX = new Float32Array(0), ptY = new Float32Array(0), ptI = new Int32Array(0), ptN = 0;
    var gCnt = new Uint32Array(0), gSx = new Float64Array(0), gSy = new Float64Array(0), gFirst = new Int32Array(0);

    function draw() {
      var size = map.getSize(), z = map.getZoom(), sc = 256 * Math.pow(2, z);
      var pw = Math.round(size.x * PAD), ph = Math.round(size.y * PAD), W = size.x + 2 * pw, Hh = size.y + 2 * ph;
      var pb = map.getPixelBounds(), ox = pb.min.x - pw, oy = pb.min.y - ph;
      L.DomUtil.setPosition(cv, map.containerPointToLayerPoint([-pw, -ph]));
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (W * Hh * dpr * dpr > MAX_CANVAS_PX) dpr = Math.sqrt(MAX_CANVAS_PX / (W * Hh));
      cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
      cv.style.width = W + 'px'; cv.style.height = Hh + 'px'; cv.style.opacity = 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, Hh);
      view = { ox: ox, oy: oy, sc: sc, pw: pw, ph: ph, z: z, W: W, H: Hh, cols: Math.ceil(W / GRID) };
      hits = []; ptN = 0;

      if (gridBox.checked && z <= CELLS_MAX_ZOOM) {
        ctx.strokeStyle = 'rgba(224,86,138,0.55)'; ctx.lineWidth = 1; ctx.fillStyle = '#731B56';
        for (var c = 0; c < NC; c++) {
          var x0 = CB[c * 4] * sc - ox, y0 = CB[c * 4 + 1] * sc - oy, x1 = CB[c * 4 + 2] * sc - ox, y1 = CB[c * 4 + 3] * sc - oy;
          if (x1 < 0 || y1 < 0 || x0 > W || y0 > Hh) continue;
          ctx.globalAlpha = Math.min(0.10 + H.cells[c][1] / 3000, 0.35);
          ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
          if (x1 - x0 > 3) { ctx.globalAlpha = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0 - 1, y1 - y0 - 1); }
        }
        ctx.globalAlpha = 1;
      }

      var i, x, y;
      if (z >= CLUSTER_OFF_ZOOM) {
        if (ptX.length < N) { ptX = new Float32Array(N); ptY = new Float32Array(N); ptI = new Int32Array(N); }
        ctx.fillStyle = '#e11d5c'; ctx.beginPath();
        for (i = 0; i < N; i++) {
          x = MX[i] * sc - ox; if (x < -4 || x > W + 4) continue;
          y = MY[i] * sc - oy; if (y < -4 || y > Hh + 4) continue;
          ctx.moveTo(x + 4, y); ctx.arc(x, y, 4, 0, 6.2832);
          ptX[ptN] = x; ptY[ptN] = y; ptI[ptN++] = i;
        }
        ctx.fill();
      } else {
        var cols = view.cols, M = cols * Math.ceil(Hh / GRID);
        if (gCnt.length < M) { gCnt = new Uint32Array(M); gSx = new Float64Array(M); gSy = new Float64Array(M); gFirst = new Int32Array(M); }
        else { gCnt.fill(0, 0, M); gSx.fill(0, 0, M); gSy.fill(0, 0, M); }
        for (i = 0; i < N; i++) {
          x = MX[i] * sc - ox; if (x < 0 || x >= W) continue;
          y = MY[i] * sc - oy; if (y < 0 || y >= Hh) continue;
          var k = ((y / GRID) | 0) * cols + ((x / GRID) | 0);
          if (gCnt[k]++ === 0) gFirst[k] = i;
          gSx[k] += x; gSy[k] += y;
        }
        // Merge clusters whose circles would overlap (grid seams), biggest first.
        var cl = [], at = new Int32Array(M).fill(-1), rows = Math.ceil(Hh / GRID), g, q;
        for (g = 0; g < M; g++) if (gCnt[g]) { at[g] = cl.length; cl.push({ x: gSx[g] / gCnt[g], y: gSy[g] / gCnt[g], n: gCnt[g], keys: [g], i: gFirst[g], live: true }); }
        var rad = function (n) { return n === 1 ? 3 : 9 + 4 * Math.log10(n); };
        var order = cl.slice().sort(function (a, b) { return b.n - a.n; });
        for (q = 0; q < order.length; q++) {
          var A = order[q]; if (!A.live) continue;
          var gx = A.keys[0] % cols, gy = (A.keys[0] / cols) | 0;
          for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
            var nx = gx + dx, ny = gy + dy; if ((!dx && !dy) || nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
            var bi = at[ny * cols + nx]; if (bi < 0) continue;
            var B = cl[bi]; if (!B.live || B === A) continue;
            var ex = A.x - B.x, ey = A.y - B.y, lim = rad(A.n) + rad(B.n) + 6;
            if (ex * ex + ey * ey >= lim * lim) continue;
            var tot = A.n + B.n;
            A.x = (A.x * A.n + B.x * B.n) / tot; A.y = (A.y * A.n + B.y * B.n) / tot; A.n = tot;
            A.keys = A.keys.concat(B.keys); B.live = false;
            for (var kk = 0; kk < B.keys.length; kk++) at[B.keys[kk]] = at[A.keys[0]];
          }
        }
        ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (q = 0; q < cl.length; q++) {
          var C = cl[q]; if (!C.live) continue;
          var n = C.n, cx = C.x, cy = C.y, r = rad(n);
          if (n === 1) {
            ctx.fillStyle = '#e11d5c'; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 6.2832); ctx.fill();
            hits.push({ x: cx, y: cy, r: 3, n: 1, keys: C.keys, i: C.i });
            continue;
          }
          ctx.fillStyle = 'rgba(225,29,92,0.28)'; ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, 6.2832); ctx.fill();
          ctx.fillStyle = 'rgba(225,29,92,0.9)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillText(n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n), cx, cy);
          hits.push({ x: cx, y: cy, r: r, n: n, keys: C.keys, i: C.i });
        }
      }
    }

    function pick(cp) {
      if (!view) return null;
      var x = cp.x + view.pw, y = cp.y + view.ph, j;
      if (view.z >= CLUSTER_OFF_ZOOM) {
        var near = [];
        for (j = 0; j < ptN; j++) { var dx = ptX[j] - x, dy = ptY[j] - y; if (dx * dx + dy * dy <= 64) near.push(ptI[j]); }
        return near.length ? { pts: near } : null;
      }
      for (j = hits.length - 1; j >= 0; j--) {
        var h = hits[j], ex = h.x - x, ey = h.y - y, rr = h.r + 4;
        if (ex * ex + ey * ey <= rr * rr) return h.n === 1 ? { pts: [h.i] } : { cluster: h };
      }
      return null;
    }

    function members(h) {
      var out = [], sc = view.sc, cols = view.cols, keys = new Set(h.keys);
      for (var i = 0; i < N; i++) {
        var x = MX[i] * sc - view.ox; if (x < 0 || x >= view.W) continue;
        var y = MY[i] * sc - view.oy; if (y < 0 || y >= view.H) continue;
        if (keys.has(((y / GRID) | 0) * cols + ((x / GRID) | 0))) out.push(i);
      }
      return out;
    }

    function line(parent, label, value) {
      parent.appendChild(document.createElement('br'));
      parent.appendChild(document.createTextNode(label + ': ' + (value || '—')));
    }
    function popupFor(idx) {
      var root = document.createElement('div'); root.className = 'fm-pop';
      for (var j = 0; j < Math.min(idx.length, POPUP_MAX); j++) {
        var i = idx[j], d = document.createElement('div'), b = document.createElement('b');
        b.textContent = H.names[D.name[i]] || 'camera';
        d.appendChild(b); line(d, 'operator', H.ops[D.op[i]]); line(d, 'type', H.types[D.type[i]]);
        root.appendChild(d);
      }
      if (idx.length > POPUP_MAX) {
        var more = document.createElement('div'); more.className = 'fm-more';
        more.textContent = '+' + (idx.length - POPUP_MAX) + ' more at this spot'; root.appendChild(more);
      }
      return root;
    }

    map.on('click', function (e) {
      var hit = pick(e.containerPoint);
      if (hit && hit.pts) {
        var i0 = hit.pts[0];
        L.popup().setLatLng([D.lat[i0] / 1e7, D.lon[i0] / 1e7]).setContent(popupFor(hit.pts)).openOn(map);
        return;
      }
      if (hit && hit.cluster) {
        var ids = members(hit.cluster), s = 90, w = 180, n = -90, ea = -180;
        for (var j = 0; j < ids.length; j++) {
          var la = D.lat[ids[j]] / 1e7, lo = D.lon[ids[j]] / 1e7;
          if (la < s) s = la; if (la > n) n = la; if (lo < w) w = lo; if (lo > ea) ea = lo;
        }
        var bounds = L.latLngBounds([s, w], [n, ea]);
        if (n - s < 1e-6 && ea - w < 1e-6) {
          L.popup().setLatLng([s, w]).setContent(popupFor(ids)).openOn(map);
          return;
        }
        var target = Math.min(map.getMaxZoom(), Math.max(view.z + 1, map.getBoundsZoom(bounds, false, L.point(40, 40))));
        map.setView(bounds.getCenter(), target);
        return;
      }
      if (gridBox.checked && view.z <= CELLS_MAX_ZOOM) {
        var gh = '', la2 = [-90, 90], lo2 = [-180, 180], ev = true, bit = 0, ch = 0;
        while (gh.length < 4) {
          var rg = ev ? lo2 : la2, v = ev ? e.latlng.lng : e.latlng.lat, mid = (rg[0] + rg[1]) / 2;
          if (v >= mid) { ch = (ch << 1) | 1; rg[0] = mid; } else { ch <<= 1; rg[1] = mid; }
          ev = !ev; if (++bit === 5) { gh += B32[ch]; bit = 0; ch = 0; }
        }
        var ci = cellIdx.get(gh);
        if (ci !== undefined) {
          var cb = ghBounds(gh);
          map.fitBounds([[cb[0], cb[1]], [cb[2], cb[3]]]);
        }
      }
    });

    var hoverQueued = false, lastMove = null, container = map.getContainer();
    map.on('mousemove', function (e) {
      lastMove = e.containerPoint;
      if (hoverQueued) return;
      hoverQueued = true;
      requestAnimationFrame(function () {
        hoverQueued = false;
        if (lastMove) L.DomUtil[pick(lastMove) ? 'addClass' : 'removeClass'](container, 'fm-hit');
      });
    });
    map.on('zoomstart', function () { cv.style.opacity = 0; });
    map.on('moveend resize', draw);
    gridBox.addEventListener('change', draw);
    draw();

    var ms = Math.round(performance.now() - t0);
    msg.textContent = N.toLocaleString() + ' cameras · ' + NC.toLocaleString() + ' cells · ' + ms + 'ms · v' + VERSION;
    window.__flock = { ready: true, n: N, cells: NC, ms: ms, version: VERSION, mode: MODE, map: map };
  }

  if (typeof DecompressionStream === 'undefined') { fail(new Error('this browser is too old (no DecompressionStream)')); return; }
  function boot() {
    var packed = window.FLOCK_PACK; window.FLOCK_PACK = null;
    if (typeof packed !== 'string') { fail(new Error('no packed dataset')); return; }
    inflateRaw(b64ToBytes(packed)).then(decodePack).then(start).catch(fail);
  }
  // Napplet build: the dataset is inlined above (single verified srcdoc blob).
  // Web build: fetch the content-hashed cams.js (preloaded in <head>).
  if (typeof window.FLOCK_PACK === 'string') { boot(); return; }
  var s = document.createElement('script');
  s.src = CAMS_SRC;
  s.onload = boot;
  s.onerror = function () { fail(new Error('cams.js failed to load')); };
  document.head.appendChild(s);
})();
  </script>
</body>
</html>
