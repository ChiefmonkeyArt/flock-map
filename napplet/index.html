<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flock Map</title>
  <!-- Fully vendored, zero-CDN: every asset below lives beside this file and is
       content-addressed in the NIP-5A manifest. No unpkg, no Esri wrapper is
       fetched at runtime beyond the raster tiles themselves (keyless Esri
       ArcGIS baseline, the same basemap the web app uses). -->
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="vendor/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css" />
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <!-- Data files: a NIP-5D shell resolves the manifest's `path` tags to
       verified blobs and INLINES them into this srcdoc (an opaque-origin
       iframe cannot fetch across to the shell's blob: URLs). The napplet
       reads the inlined values first and only falls back to relative fetch
       in the standalone same-origin web-app preview. -->
  <script>
    window.FLOCK_ASSETS = window.FLOCK_ASSETS || {
      inlined: false,
      manifest: null,
      cams: null,
    };
  </script>
  <script src="cams.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #07070b; }
    #map { height: 100%; }
    #status {
      position: fixed; top: 10px; right: 10px; z-index: 1000;
      background: #111; color: #eee; padding: 8px 12px;
      font: 13px/1.4 monospace; border-radius: 6px;
      border: 1px solid #2a2a33;
    }
    .mk-cluster { color: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">loading…</div>
  <script>
    // Self-contained Flock Map — renders the camera dataset from the
    // content-addressed manifest + cams.js shipped in this bundle. No shell
    // capability is required; it is a display-only napplet (no NAP facades).
    const BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";
    function geohashBounds(gh) {
      let lat = [-90, 90], lon = [-180, 180], even = true;
      for (const c of gh) {
        const cd = BASE32.indexOf(c);
        for (const mask of [16, 8, 4, 2, 1]) {
          if (even) {
            const mid = (lon[0] + lon[1]) / 2;
            if (cd & mask) lon[0] = mid; else lon[1] = mid;
          } else {
            const mid = (lat[0] + lat[1]) / 2;
            if (cd & mask) lat[0] = mid; else lat[1] = mid;
          }
          even = !even;
        }
      }
      return [[lat[0], lon[0]], [lat[1], lon[1]]];
    }

    const map = L.map("map", { minZoom: 2 }).setView([39.8, -98.5], 4);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Esri, HERE, Garmin, © OpenStreetMap contributors",
      maxZoom: 16,
    }).addTo(map);

    const status = document.getElementById("status");

    const digitalCams = L.markerClusterGroup({
      chunkedLoading: true,
      chunkInterval: 120,
      maxClusterRadius: 56,
      disableClusteringAtZoom: 12,
      showCoverageOnHover: false,
    });

    const cellLayer = L.layerGroup().addTo(map);

    function renderDigital(recs) {
      const pts = [];
      const t0 = performance.now();
      for (const r of recs) {
        const m = L.circleMarker([r[0], r[1]], {
          radius: 2.6, color: "#e11d5c", fillColor: "#e11d5c",
          fillOpacity: 0.8, stroke: false,
        });
        const name = r[2] ? r[2].replace(/[<>&"]/g, "") : "camera";
        const op = r[3] ? r[3].replace(/[<>&"]/g, "") : "—";
        const type = r[4] ? r[4].replace(/[<>&"]/g, "") : "—";
        m.bindPopup("<b>" + name + "</b><br>operator: " + op + "<br>type: " + type);
        pts.push(m);
      }
      digitalCams.addLayers(pts);
      status.textContent = recs.length.toLocaleString() + " cameras · cluster layer ready · " + Math.round(performance.now() - t0) + "ms";
    }

    async function load() {
      try {
        // Inlined (srcdoc) mode: the shell already wrote the verified data into
        // window.__FLOCK_MANIFEST__ and window.CAMS. Otherwise fetch relative
        // (standalone web-app preview only).
        let manifest;
        if (window.__FLOCK_MANIFEST__) {
          manifest = window.__FLOCK_MANIFEST__;
        } else {
          const r = await fetch("manifest.json");
          manifest = await r.json();
        }

        let CAMS = window.CAMS;
        if (!CAMS && window.FLOCK_ASSETS && window.FLOCK_ASSETS.cams) {
          const rc = await fetch(window.FLOCK_ASSETS.cams);
          const txt = await rc.text();
          CAMS = new Function(txt + "; return window.CAMS;")();
        }

        for (const [gh, meta] of Object.entries(manifest.tiles)) {
          const [sw, ne] = geohashBounds(gh);
          const rect = L.rectangle([sw, ne], {
            color: "#e0568a", weight: 1, fillColor: "#731B56",
            fillOpacity: Math.min(0.10 + meta.count / 3000, 0.35),
          }).addTo(cellLayer);
          rect.on("click", () => { map.fitBounds([[sw[0], sw[1]], [ne[0], ne[1]]]); });
          rect.bindPopup("<b>" + gh + "</b><br>" + meta.count.toLocaleString() + " cameras<br><i>click to zoom</i>");
        }

        status.textContent = "loading " + manifest.total_cameras.toLocaleString() + " cameras…";
        if (CAMS) renderDigital(CAMS);
        map.addLayer(digitalCams);
        status.textContent = manifest.total_cameras.toLocaleString() + " cameras · " + Object.keys(manifest.tiles).length + " cells";
      } catch (e) {
        status.textContent = "error: " + e.message;
      }
    }

    load();
  </script>
</body>
</html>
