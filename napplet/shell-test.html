<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flock Map napplet — reference shell</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #frame { width: 100%; height: 100%; border: 0; display: block; }
    pre { color: #e11d5c; padding: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <iframe id="frame" sandbox="allow-scripts" title="Flock Map napplet"></iframe>
  <script>
    // Reference NIP-5D shell (dev harness only — not part of the bundle).
    // Mirrors a production mount of a single-file napplet:
    //   1. read the kind 35129 manifest (here: the unsigned build output),
    //   2. fetch each `path` blob and re-hash it against its tag,
    //   3. recompute the aggregate `x` and compare,
    //   4. write the verified bytes into an opaque-origin sandboxed srcdoc.
    // The napplet carries its whole dataset inline, so no inlining, base href
    // or cross-origin fetch is needed.
    (async function () {
      var frame = document.getElementById('frame');
      function fail(m) { var p = document.createElement('pre'); p.textContent = m; document.body.replaceChildren(p); }
      async function sha256hex(buf) {
        var d = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
        return Array.from(d, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      }
      var ev = await (await fetch('dist/flock-map.nip5a.unsigned.json')).json();
      if (ev.kind !== 35129) return fail('not a kind 35129 manifest');
      var paths = ev.tags.filter(function (t) { return t[0] === 'path'; });
      var agg = ev.tags.find(function (t) { return t[0] === 'x' && t[2] === 'aggregate'; });
      if (!agg) return fail('manifest has no aggregate x tag');
      var blobs = {};
      for (var i = 0; i < paths.length; i++) {
        var buf = await (await fetch(paths[i][1].replace(/^\//, ''))).arrayBuffer();
        var h = await sha256hex(buf);
        if (h !== paths[i][2]) return fail(paths[i][1] + ' hash mismatch: ' + h);
        blobs[paths[i][1]] = buf;
      }
      var lines = paths.map(function (t) { return t[2] + ' ' + t[1] + '\n'; }).sort().join('');
      var a = await sha256hex(new TextEncoder().encode(lines));
      if (a !== agg[1]) return fail('aggregate mismatch: ' + a);
      if (!blobs['/index.html']) return fail('bundle has no /index.html');
      frame.srcdoc = new TextDecoder().decode(blobs['/index.html']);
      window.__shell = { verified: true, aggregate: a };
    })().catch(function (e) { document.body.textContent = 'shell error: ' + e.message; });
  </script>
</body>
</html>
